name: Build and Test

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    
    - name: Build all modules
      run: mvn clean compile
    
    - name: Run tests for core modules
      run: mvn test -pl easy-rules-core,easy-rules-mvel,easy-rules-spel,easy-rules-jexl,easy-rules-support
    
    - name: Run PostgreSQL module tests
      run: |
        # Testcontainers requires Docker
        mvn test -pl easy-rules-postgresql -DtestFailureIgnore=false
      env:
        # Testcontainers configuration
        TESTCONTAINERS_REUSE_ENABLE: true
        TESTCONTAINERS_CHECKS_DISABLE: false
    
    - name: Package all modules
      run: mvn package -DskipTests
    
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-reports
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          **/target/*.jar
          !**/target/*-sources.jar
          !**/target/*-javadoc.jar

  # Job to run integration tests specifically for PostgreSQL module
  integration-test-postgresql:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3
      
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run PostgreSQL integration tests
      run: |
        cd easy-rules-postgresql
        mvn verify -Pit
      env:
        TESTCONTAINERS_REUSE_ENABLE: true
    
    - name: Upload integration test reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: postgresql-integration-test-reports
        path: easy-rules-postgresql/target/failsafe-reports/

  # Publish snapshot versions to Sonatype OSSRH
  publish-snapshot:
    runs-on: ubuntu-latest
    needs: [build, integration-test-postgresql]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        server-id: sonatype-nexus-snapshots
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
    
    - name: Publish snapshot
      run: |
        # Only deploy if version ends with -SNAPSHOT
        if mvn help:evaluate -Dexpression=project.version -q -DforceStdout | grep -q "SNAPSHOT"; then
          mvn clean deploy -DskipTests -P release
        else
          echo "Not a SNAPSHOT version, skipping deployment"
        fi
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}