name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'maven'
        server-id: sonatype-nexus-staging
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE
    
    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
    
    - name: Build and test all modules
      run: mvn clean verify
    
    - name: Deploy to Maven Central
      run: |
        mvn deploy -DskipTests -P release \
          -Dgpg.passphrase="${{ secrets.MAVEN_GPG_PASSPHRASE }}"
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Changes in this release
          
          ### easy-rules-postgresql module
          - Database-driven rules with PostgreSQL backend
          - Support for dynamic rule loading and updates
          - Integration with Flyway for database migrations
          
          ### Installation
          
          ```xml
          <dependency>
              <groupId>org.jeasy</groupId>
              <artifactId>easy-rules-postgresql</artifactId>
              <version>${project.version}</version>
          </dependency>
          ```
          
          See [CHANGELOG](https://github.com/j-easy/easy-rules/blob/master/CHANGELOG.md) for detailed changes.
        draft: true
        prerelease: false
    
    - name: Upload release artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-artifacts
        path: |
          **/target/*.jar
          **/target/*.pom
          **/target/*.asc